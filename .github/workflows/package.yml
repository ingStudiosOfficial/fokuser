name: Package Chrome Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install && npm run build

      - name: Compress to zip
        id: packExtensionDir
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
        with:
          extensionDir: "extension/dist"
          zipFilePath: "extension/build/extension.zip"

      - name: Build crx file
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: "extension/build/extension.zip"
          crxFilePath: "extension/build/extension.crx"
          privateKey: ${{ secrets.PEM_KEY }}

      - name: Parse version
        id: version_parser
        run: |
          TAG=${{ github.ref_name }}
          CLEAN_VERSION=${TAG#v}
          echo "clean=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Upload crx to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Version ${{ steps.version_parser.outputs.clean }}${{ startsWith(github.ref_name, 'v0.') && ' Beta' || '' }}"
          draft: false
          make_latest: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            extension/build/extension.zip
            extension/build/extension.crx
          body: >
            # Fokuser Version ${{ steps.version_parser.outputs.clean }}${{ startsWith(github.ref_name, 'v0.') && ' Beta' || '' }}

            ## Installation

            ### Via the crx file

            1. Download ```extension.crx```

            2. Go to ```chrome://extensions``` and drop ```extension.crx``` in

            ### Via the zip file

            1. Download ```extension.zip```

            2. Extract ```extension.zip```

            3. Turn on developer mode in ```chrome://extensions```

            4. Click 'Load unpacked'

            5. Open the extracted file

      - name: Upload crx artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-crx
          path: extension/build/extension.crx

  publish-extension:
    name: Publish Chrome Extension
    runs-on: ubuntu-latest
    needs: build-extension
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
    steps:
      - name: Download crx artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-crx
          path: extension

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ secrets.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/chromewebstore"

      - name: Upload and publish to Chrome Web Store
        run: |
          ACCESS_TOKEN="${{ steps.auth.outputs.access_token }}"
          PUBLISHER_ID="${{ secrets.PUBLISHER_ID }}"
          EXTENSION_ID="${{ secrets.EXTENSION_ID }}"

          curl -f -H "Authorization: Bearer $ACCESS_TOKEN" \
               -H "x-goog-api-version: 2" \
               -X POST \
               --data-binary @extension/extension.crx \
               "https://chromewebstore.googleapis.com/upload/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:upload"
               
          curl -f -H "Authorization: Bearer $ACCESS_TOKEN" \
               -H "x-goog-api-version: 2" \
               -X POST \
               "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:publish"
