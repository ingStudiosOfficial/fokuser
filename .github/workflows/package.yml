name: Package Chrome Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install && npm run build

      - name: Compress to zip
        id: packExtensionDir
        uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
        with:
          extensionDir: "dist"
          zipFilePath: "build/extension.zip"

      - name: Build crx file
        uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
          zipFilePath: "build/extension.zip"
          crxFilePath: "build/extension.crx"
          privateKey: ${{ secrets.PEM_KEY }}

      - name: Parse version
        id: version_parser
        run: |
          TAG=${{ github.ref_name }}
          CLEAN_VERSION=${TAG#v}
          echo "clean=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Upload crx to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Version ${{ steps.version_parser.outputs.clean }}${{ startsWith(github.ref_name, 'v0.') && ' Beta' || '' }}"
          draft: false
          make_latest: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
          files: |
            build/extension.zip
            build/extension.crx
          body: >
            # Fokuser Version ${{ steps.version_parser.outputs.clean }}${{ startsWith(github.ref_name, 'v0.') && ' Beta' || '' }}

            ## Installation

            ### Via the crx file

            1. Download ```extension.crx```

            2. Go to ```chrome://extensions``` and drop ```extension.crx``` in

            ### Via the zip file

            1. Download ```extension.zip```

            2. Extract ```extension.zip```

            3. Turn on developer mode in ```chrome://extensions```

            4. Click 'Load unpacked'

            5. Open the extracted file
